# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ivancho07
# "service" is the name of this project. This will also be added to your AWS resource names.
service: aws-crud-node

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamoDB:*
      Resource: 
        - arn:aws:dynamodb:us-east-2:961387686323:table/TasksTable

functions:
  hello:
    handler: src/handler.hello
    events:
      - httpApi:
          path: /
          method: get
  CreateTask:
      handler: src/addTask.addTask
      events:
        - httpApi:
            path: /task
            method: post

resources:
  Resources:
    TasksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TasksTable
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
